name: ContainerCare CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Backend Tests & Docker Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install backend dependencies from requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run all backend unit tests (Member 1, Member 2, and API Layer)
      - name: Run backend unit tests
        run: |
          python -m unittest discover -s backend/tests -v

      # Step 5: Set up Docker Buildx for optimized image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Validate Docker Compose specification syntax and schema
      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      # Step 7: Build both backend and frontend Docker images
      - name: Build Docker Compose images
        run: |
          docker compose build
